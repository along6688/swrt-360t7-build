name: Build SWRT for Qihoo 360T7

# 说明:
#   - SWRT 是华硕(asuswrt)风格的 MTK SDK 固件树, 不是 OpenWrt buildroot,
#     编译方式为: cd release/src-mtk-arm && make swrt-swrt360t7
#   - 使用作者(paldier)提供的官方 Docker 镜像 paldier/swrt-docker,
#     里面预装了全部编译依赖和 MTK 工具链(/home/docker/envs/toolchain.sh 自动挂链)
#   - /mnt:/project 卷是官方 CI 的磁盘技巧: runner 的 /mnt 分区比主盘大,
#     源码(约2.2GB)+编译产物都放这里, 避免磁盘写满
#   - GIT_PIN 固定在上游 CI 最后一次成功的提交(2026-07-07, 360t7 构建通过)。
#     上游 2026-09-22 的提交导致 master 分支多机型编译失败(含 360t7),
#     上游修复后, 可在手动触发时把 git_pin 填成 master 切回最新代码
on:
  workflow_dispatch:
    inputs:
      git_pin:
        description: '要编译的 commit SHA 或分支名(默认用最后验证通过的提交)'
        required: false
        default: ''
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-swrt-360t7.yml'

concurrency:
  group: build-swrt-360t7
  cancel-in-progress: true

env:
  GIT_PIN: ${{ inputs.git_pin || '178b0feb9c61f79b19df09d56614bb32f2c0c038' }}

jobs:
  build:
    name: 编译 SWRT 360T7 固件
    runs-on: ubuntu-latest
    timeout-minutes: 355
    container:
      image: paldier/swrt-docker:latest
      env:
        MODELCFG: swrt-swrt360t7
        SDK: src-mtk-arm
        GIT_REPO: https://github.com/SWRT-dev/swrt-gpl.git
        PROJECT_DIR: /project/swrt-gpl
        PROJECTBASEDIR: /project
      options: --user docker
      volumes:
        - /mnt:/project
    steps:
      - name: 环境检查(磁盘/用户)
        run: |
          cd /
          echo "--- Disk available ---"
          df -h
          echo "--- I am: $(id) ---"

      - name: 修复容器内目录权限
        run: sudo chown -R docker:docker /github/home /home/docker /project

      - name: 拉取 swrt-gpl 源码
        run: |
          cd /project
          rm -rf swrt-gpl
          git init swrt-gpl
          cd swrt-gpl
          git remote add origin "$GIT_REPO"
          # 浅拉取指定提交/分支 (GitHub 支持按 SHA fetch)
          if git fetch --depth 1 origin "$GIT_PIN"; then
            git checkout -qf FETCH_HEAD
            echo "checkout OK -> $(git log --oneline -1)"
          else
            echo "fetch $GIT_PIN FAILED"
            exit 1
          fi
          # 配置 git 身份: 构建脚本中的 git 操作可能需要提交者信息
          git config user.email "builder@example.com"
          git config user.name "builder"

      - name: 配置 MTK 工具链
        run: |
          sudo /home/docker/envs/toolchain.sh
          echo "--- /home/docker/envs ---"
          ls -alh /home/docker/envs/
          echo "--- /opt toolchains ---"
          ls -alh /opt/ | head -20

      - name: 编译 swrt-swrt360t7
        run: |
          echo "--- Space before build ---"
          df -h
          cd "$PROJECT_DIR/release/$SDK"
          echo "--- BUILD $MODELCFG ---"
          make "$MODELCFG"

      - name: 收集固件产物
        run: |
          mkdir -p /project/out
          cp -fv "$PROJECT_DIR/release/$SDK/image/"* /project/out/ 2>/dev/null || true
          echo "--- /project/out ---"
          ls -lh /project/out/
          # 拷进工作区, 供 upload-artifact 使用
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -fv /project/out/* "$GITHUB_WORKSPACE/out/"
          ls -lh "$GITHUB_WORKSPACE/out/"

      - name: 校验产物存在
        run: |
          if ! ls "$GITHUB_WORKSPACE/out/"* >/dev/null 2>&1; then
            echo "未找到任何固件文件, 编译可能失败"
            ls -alh "$PROJECT_DIR/release/$SDK/" | head -40
            exit 1
          fi

      - name: 上传固件 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swrt-360t7
          path: out/*
          if-no-files-found: error
          retention-days: 30
